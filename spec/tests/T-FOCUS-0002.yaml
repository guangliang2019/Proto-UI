  - id: react-focus-catalog
    kind: adapter-test
    status: passing
    path: packages/adapters/react/test/focus-catalog.integration.test.ts
    required: true
    consumesCases: [T-FOCUS-0002-CASE-ENTRY, T-FOCUS-0002-CASE-ROVING]
  - id: vue-focus-catalog
    kind: adapter-test
    status: passing
